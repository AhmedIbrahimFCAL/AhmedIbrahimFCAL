name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 0 * * *" # Runs every 24 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Generate Pacman files
        uses: abozanona/arcade-contribution-graph@v1.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          # This creates both light and dark versions
          games: 'pacman'
          
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
